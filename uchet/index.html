<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Home Hostel №1 — учёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#fbf5ea;--card:#fff;--ink:#27221b;--muted:#6f675a;--line:#ebe0cc;
--green:#2f7d4f;--tomato:#d9481f;--sun:#f6b62e;--blue:#3560c0;
--green-t:#e2f0e2;--tomato-t:#fde5da;--sun-t:#fdefc8;--blue-t:#e0e9fa;
--display:"Yeseva One",Georgia,serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
h3{font-size:15px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--blue);border-bottom:3px solid var(--tomato);padding-bottom:3px;line-height:1}
.logo i{font-style:normal;width:30px;height:30px;display:grid;place-items:center;border:2.5px solid var(--blue);border-radius:50%;color:var(--tomato);font-weight:800;font-size:11px}
.who{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{background:var(--sun-t);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:14.5px;white-space:pre-line}
.memo b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8a5f00;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi.good b{color:var(--green)}.kpi.bad b{color:var(--tomato)}
.room{margin-bottom:18px}
.room-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.room-h span{font-size:13px;color:var(--muted)}
.beds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bed{min-height:68px;border-radius:14px;border:1.5px dashed #cdbf9f;background:transparent;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.bed em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
.bed strong{font-size:13px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed.busy{border:1.5px solid transparent;background:var(--green-t)}
.bed.soon{background:var(--sun-t)}
.bed.late{background:var(--tomato-t)}
.bed.debt{box-shadow:inset 0 0 0 2px var(--tomato)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;width:100%;text-align:left;cursor:pointer}
.row div{min-width:0}
.row b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{display:block;font-size:12.5px;color:var(--muted)}
.row .amt{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.row .amt span{font-weight:500}
.neg{color:var(--tomato)}.pos{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;border:0;background:var(--tomato);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.blue{background:var(--blue)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btns .btn{flex:1 1 auto}
button:disabled{opacity:.55;cursor:default}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bars{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:74px 1fr 78px;gap:8px;align-items:center;font-size:13px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:7px;background:var(--blue);min-width:2px}
.bar.g i{background:var(--green)}.bar.t i{background:var(--tomato)}.bar.s i{background:var(--sun)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pl{background:var(--card);border-radius:16px;padding:6px 14px}
.pl div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.pl div:last-child{border:0;font-weight:800;font-size:16px}
.pl.flat div:last-child{font-weight:400;font-size:14.5px}
.pl b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:14px;background:var(--card);border-radius:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,245,234,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs button{min-width:0;border:0;background:transparent;padding:8px 2px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--blue);background:var(--blue-t)}
body.locked .tabs,body.locked .who{display:none}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(39,34,27,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w{grid-column:1/-1}
label{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;height:46px;-webkit-appearance:none;appearance:none}
textarea{height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.total{background:var(--card);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.total b{font-family:var(--display);font-weight:400;font-size:24px}
.err{color:var(--tomato);font-size:13.5px;margin-top:8px;min-height:18px}
.loadbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:50;background:linear-gradient(90deg,var(--blue),var(--sun),var(--blue));background-size:200% 100%;animation:run 1s linear infinite;display:none}
.loadbar.on{display:block}
@keyframes run{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.loadbar{animation:none}}
.toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;display:none}
.toast.on{display:block}.toast.bad{background:var(--tomato)}
.gate{max-width:420px;margin:8vh auto 0}
.gate h2{margin-bottom:8px}
.gate .btn{width:100%;margin-top:12px}
.bonus{background:var(--blue-t);color:#1f3f86;border-radius:14px;padding:10px 14px;font-size:14px;margin:-6px 0 16px}
.bonus.warn{background:var(--sun-t);color:#6b4a00}
.more{margin-top:14px;background:var(--card);border-radius:14px;padding:4px 14px 10px}
.more summary{cursor:pointer;font-weight:600;font-size:14.5px;padding:10px 0;color:var(--blue)}
.more .sec{margin-top:12px}
.more input,.more select{background:var(--paper)}
.row .amt a{color:var(--muted);font-size:12.5px}
.bonus.got{background:var(--green-t);color:#1d5a36}
.stamp{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}
@media (min-width:600px){.beds{grid-template-columns:repeat(8,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body class="locked">
<div class="loadbar" id="busy"></div>
<header class="top">
  <div class="logo"><b>Home Hostel</b><i>№1</i></div>
  <button class="who" id="whoBtn" type="button"></button>
</header>
<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs">
  <button data-t="beds" type="button"><svg viewBox="0 0 24 24"><path d="M3 18V6M21 18v-6a3 3 0 0 0-3-3H3M3 14h18M7 9V7"/></svg>Места</button>
  <button data-t="guests" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5a6 6 0 0 1 3.5 5.5"/></svg>Гости</button>
  <button data-t="cash" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg>Касса</button>
  <button data-t="zp" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11M16 13.5h2"/></svg>ЗП</button>
  <button data-t="owner" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Владелец</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* Адрес веб-приложения Google Apps Script (заканчивается на /exec).
   Пока он пустой, страница попросит вставить адрес и запомнит его на этом устройстве. */
var API='https://script.google.com/macros/s/AKfycby0zVTmjiOZCZiAXw8N7JB3kJVojajfeFDJ6aGu3Co_zN1398blgIFLfMLB9McqTz3JmQ/exec';

var H=3600000, D=24*H, LS_API='hh1-uchet-api', LS_CODE='hh1-uchet-code';
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var KIND_STAY='Проживание',KIND_REFUND='Возврат';

/* ===== состояние ===== */
var S=null, C=null, code='', tab='beds', ownerMonth=null, guestFilter='in', busy=false, loadedAt=0, toastT=0;
function $(id){return document.getElementById(id)}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
function apiUrl(){return API||lsGet(LS_API)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){n=Math.round(n||0);var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (n<0?'−':'')+s+' ₸'}
function p2(n){return String(n).padStart(2,'0')}
function dt(ts){var d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function dOnly(ts){var d=new Date(ts);return p2(d.getDate())+'.'+p2(d.getMonth()+1)}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
function mKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function mName(k){var a=k.split('-');return MON[+a[1]-1]+' '+a[0]}
function tariff(k){for(var i=0;i<C.tariffs.length;i++)if(C.tariffs[i].k===k)return C.tariffs[i];return {k:k,name:'Тариф',price:0,h:24}}
function period(h){return h>=720?'месяц':h===24?'сутки':h+' ч'}
function bedLabel(id){var a=String(id).split('-');return 'Комн. '+a[0]+', место '+a[1]}
function total(){var t=0;C.rooms.forEach(function(R){t+=R.beds});return t}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function isOwner(){return S&&S.user.role==='owner'}
function cashName(){return C.methods[0]||'Наличные'}

/* ===== связь с сервером ===== */
function setBusy(b){busy=b;$('busy').classList.toggle('on',b);document.querySelectorAll('.sheet .btn').forEach(function(x){x.disabled=b})}
function toast(msg,bad){var t=$('toast');t.textContent=msg;t.className='toast on'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast'},bad?6000:2500)}
function post(op){
  return fetch(apiUrl(),{method:'POST',body:JSON.stringify({code:code,op:op||null})}).then(function(r){
    if(!r.ok)throw new Error('http');return r.json();
  });
}
function accept(res){S=res;C=res.cfg;loadedAt=Date.now()}
/* op — запись на сервер; done — что сделать после ответа. Сервер всегда возвращает свежие данные. */
function send(op,done,errEl){
  if(busy)return;setBusy(true);
  post(op).then(function(res){
    setBusy(false);
    if(res&&res.ok){accept(res);render(true);if(done)done();return}
    if(res&&res.auth===false){if(S){logout('Код больше не действует. Войдите заново.');return}code='';lsSet(LS_CODE,'')}
    var m=(res&&res.error)||'Не получилось сохранить.';
    if(errEl&&$(errEl))$(errEl).textContent=m;else toast(m,true);
    if(op)refresh();
  }).catch(function(){
    setBusy(false);
    var m=op?'Нет связи. Запись не сохранена, нажмите ещё раз.':'Нет связи с сервером.';
    if(errEl&&$(errEl))$(errEl).textContent=m;else toast(m,true);
  });
}
function refresh(){
  if(busy||!S||$('sheet').classList.contains('on'))return;
  post(null).then(function(res){if(res&&res.ok&&!busy&&!$('sheet').classList.contains('on')){accept(res);render(true)}else if(res&&res.auth===false)logout('Код больше не действует. Войдите заново.')}).catch(function(){});
}
function logout(msg){S=null;C=null;code='';lsSet(LS_CODE,'');closeSheet();render();if(msg)toast(msg,true)}

/* ===== расчёты ===== */
function paidOf(st){var s=0;for(var i=0;i<S.pays.length;i++)if(S.pays[i].stay===st.id)s+=S.pays[i].amount;return s}
function debtOf(st){return st.sum+(st.extra||0)-paidOf(st)}
function stayById(id){for(var i=0;i<S.stays.length;i++)if(S.stays[i].id===id)return S.stays[i];return null}
function activeAt(bed){for(var i=S.stays.length-1;i>=0;i--)if(S.stays[i].bed===bed&&S.stays[i].status==='in')return S.stays[i];return null}
function dayStart(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function inRange(ts,a,b){return ts>=a&&ts<b}
function sumPays(a,b,f){var s=0;S.pays.forEach(function(p){if(inRange(p.ts,a,b)&&(!f||f(p)))s+=p.amount});return s}
function sumExp(a,b,f){var s=0;S.exp.forEach(function(e){if(inRange(e.ts,a,b)&&(!f||f(e)))s+=e.amount});return s}
function salCost(a,b){var s=0;S.shifts.forEach(function(h){if(h.ts&&inRange(h.ts,a,b))s+=(h.accrued||h.salary||0)});return s}
function plural(n,a,b,c){var m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c}
function sumShift(a,b,k){var s=0;S.shifts.forEach(function(h){if(inRange(h.ts,a,b))s+=(h[k]||0)});return s}
function isCash(p){return p.method===cashName()}
function monthRange(k){var a=k.split('-');return [new Date(+a[0],+a[1]-1,1).getTime(),new Date(+a[0],+a[1],1).getTime()]}
function monthStats(k){
  var r=monthRange(k),a=r[0],b=r[1],end=Math.min(b,Date.now()),T=total();
  var rev=sumPays(a,b),cash=sumPays(a,b,isCash),exp=sumExp(a,b),sal=salCost(a,b);
  var guests=0,occH=0,wd=[0,0,0,0,0,0,0],hr=[0,0,0,0,0,0,0,0],src={};
  S.stays.forEach(function(st){
    if(inRange(st.tin,a,b)){guests++;wd[(new Date(st.tin).getDay()+6)%7]++;hr[Math.floor(new Date(st.tin).getHours()/3)]++;var sn=st.src||'Не указано';src[sn]=(src[sn]||0)+1}
    var o=Math.min(st.status==='in'?Math.max(st.tout,end):st.tout,end)-Math.max(st.tin,a);if(o>0)occH+=o;
  });
  var cats={};S.exp.forEach(function(e){if(inRange(e.ts,a,b))cats[e.cat]=(cats[e.cat]||0)+e.amount});
  var occ=end>a&&T?occH/((end-a)*T):0;
  return {rev:rev,cash:cash,noncash:rev-cash,exp:exp,sal:sal,net:rev-exp-sal,guests:guests,occ:occ,wd:wd,hr:hr,cats:cats,src:src,days:Math.max(1,Math.round((end-a)/D)),a:a,b:b};
}
function months(){var set={};S.stays.forEach(function(s){set[mKey(s.tin)]=1});S.pays.forEach(function(p){set[mKey(p.ts)]=1});set[mKey(Date.now())]=1;return Object.keys(set).sort()}

/* ===== вход ===== */
function vSetup(){
  return '<div class="gate"><h2>Подключение учёта</h2><p class="hint">Вставьте адрес веб-приложения из Google Apps Script. Он заканчивается на /exec. Это делается один раз на устройстве.</p><div class="f" style="margin-top:14px"><label for="apiIn">Адрес</label><input id="apiIn" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div><button class="btn blue" type="button" data-act="api-save">Подключить</button><div class="err" id="gErr"></div></div>';
}
function vLogin(){
  return '<div class="gate"><h2>Учёт хостела</h2><p class="hint">Введите свой код. Код выдаёт владелец.</p><div class="f" style="margin-top:14px"><label for="codeIn">Код доступа</label><input id="codeIn" type="password" inputmode="numeric" autocomplete="off"></div><button class="btn blue" type="button" data-act="login">Войти</button><div class="err" id="gErr"></div>'+(API?'':'<p class="stamp"><a href="#" data-act="api-reset">Сменить адрес подключения</a></p>')+'</div>';
}
function login(c){

}
function fPayout(){
  openSheet(head('Выплата зарплаты')+'<div class="grid"><div class="f w"><label for="yTo">Кому</label><select id="yTo">'+opts(C.admins||[])+'</select></div><div class="f"><label for="yAmt">Сумма, ₸</label><input id="yAmt" type="number" min="0" inputmode="numeric"></div><div class="f"><label for="yMet">Способ</label><select id="yMet">'+opts(C.methods,C.methods[2]||C.methods[0])+'</select></div><div class="f w"><label for="yNote">Комментарий</label><input id="yNote" autocomplete="off"></div></div><p class="hint">Сюда вносятся выплаты от владельца: перевод, аванс, наличные из своих. То, что админ взял из кассы при закрытии смены, уже учтено и на кассу эта запись не влияет.</p><div class="err" id="yErr"></div><div class="btns"><button class="btn blue" type="button" data-act="payout-save" data-yid="'+uid('y')+'">Сохранить выплату</button></div>');
}
function fWho(){openSheet(head(esc(S.user.name))+'<p class="hint" style="margin:-4px 0 4px">'+(isOwner()?'Вы вошли как владелец.':'Ваше имя записывается в каждую операцию. Передаёте телефон другому админу — выйдите, чтобы он вошёл под своим кодом.')+'</p><div class="btns"><button class="btn ghost" type="button" data-act="logout">Выйти</button></div>')}

/* ===== действия ===== */
function num(id){return Math.max(0,parseInt($(id).value,10)||0)}
function act(a,el){
  var id=el.getAttribute('data-id'),st=id&&S?stayById(id):null;
  if(a==='close')return closeSheet();
  if(a==='api-save'){var u=$('apiIn').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec(\?.*)?$/.test(u)){$('gErr').textContent='Адрес должен начинаться с https://script.google.com/ и заканчиваться на /exec.';return}lsSet(LS_API,u);return render()}
  if(a==='api-reset'){lsSet(LS_API,'');return render()}
  if(a==='login')return login($('codeIn').value);
  if(!S)return;
  if(a==='logout')return logout();
  if(a==='refresh')return send(null,function(){toast('Обновлено.')});
  if(a==='in'){if(!canWork()){toast(S.shift?'Сейчас открыта смена: '+S.shift.admin+'.':'Сначала примите смену: кнопка вверху экрана.',true);return}return fCheckin(el.getAttribute('data-bed'))}
  if(a==='open')return fOpen();
  if(a==='open-save')return send({t:'open',hid:el.getAttribute('data-hid'),counted:num('oCnt')},function(){closeSheet();toast('Смена принята. Хорошей работы.')},'oErr');
  if(a==='bonus')return fBonus(el.getAttribute('data-hid'));
  if(a==='bonus-yes'){var bm=num('bAmt');if(!bm){$('bErr').textContent='Введите сумму премии.';return}return send({t:'bonus',hid:el.getAttribute('data-hid'),give:true,amount:bm},function(){closeSheet();toast('Премия начислена.')},'bErr')}
  if(a==='bonus-no')return send({t:'bonus',hid:el.getAttribute('data-hid'),give:false},function(){closeSheet();toast('Записано: без премии.')},'bErr');
  if(a==='cfg')return fCfg();
  if(a==='cfg-save')return send({t:'cfg',rate:num('gRate'),bonusFrom:num('gFrom'),bonus:num('gBon'),phone:$('gPh').value.trim()},function(){closeSheet();toast('Сохранено.')},'gErr2');
  if(a==='move'&&st)return send({t:'move',sid:id,bed:$('mBed').value},function(){fStay(id);toast('Гость переселён.')},'xErr');
  if(a==='refund'&&st){var rm=num('rAmt'),rn=$('rNote').value.trim();if(!rm){$('xErr').textContent='Введите сумму возврата.';return}if(!rn){$('xErr').textContent='Напишите причину возврата.';return}return send({t:'refund',sid:id,pid:el.getAttribute('data-pid'),amount:rm,method:$('rMet').value,note:rn},function(){fStay(id);toast('Возврат записан.')},'xErr')}
  if(a==='cancel'){var ck=el.getAttribute('data-kind'),bk=el.getAttribute('data-back');if(el.getAttribute('data-sure')!=='1'){el.setAttribute('data-sure','1');el.textContent=ck==='stay'?'Точно отменить заселение?':'точно отменить?';return}return send({t:'cancel',kind:ck,id:id},function(){if(bk&&stayById(bk))fStay(bk);else closeSheet();toast('Запись отменена.')})}
  if(a==='stay')return fStay(id);
  if(a==='gf'){guestFilter=el.getAttribute('data-v');return render()}
  if(a==='om'){ownerMonth=el.getAttribute('data-v');return render(true)}
  if(a==='exp')return fExp();
  if(a==='shift')return fShift();
  if(a==='payout')return fPayout();
  if(a==='payout-save'){var ya=num('yAmt');if(!ya){$('yErr').textContent='Введите сумму.';return}return send({t:'payout',yid:el.getAttribute('data-yid'),to:$('yTo').value,amount:ya,method:$('yMet').value,note:$('yNote').value.trim()},function(){closeSheet();toast('Выплата записана.')},'yErr')}
  if(a==='memo')return send({t:'memo',text:$('memoT').value.trim()},function(){toast('Памятка сохранена. Админы увидят её на экране «Места».')},'memoErr');
  if(a==='in-save'){
    var name=$('cName').value.trim();if(!name){$('cErr').textContent='Введите имя гостя.';return}
    if(v3()&&unitIn()!==tariff($('cTar').value).price&&!$('cNote').value.trim()){$('cErr').textContent='Цена отличается от тарифа. Напишите причину.';return}
    return send({t:'checkin',sid:el.getAttribute('data-sid'),pid:el.getAttribute('data-pid'),bed:el.getAttribute('data-bed'),name:name,phone:$('cPhone').value.trim(),tariff:$('cTar').value,qty:Math.max(1,parseInt($('cQty').value,10)||1),tin:new Date($('cIn').value).getTime()||Date.now(),paid:num('cPaid'),method:$('cMet').value,src:$('cSrc').value,unit:v3()?unitIn():undefined,pnote:$('cNote')?$('cNote').value.trim():''},function(){closeSheet();toast('Гость заселён.')},'cErr');
  }
  if(a==='pay'&&st){var am=num('pAmt');if(!am){$('sErr').textContent='Введите сумму.';return}return send({t:'pay',sid:id,pid:el.getAttribute('data-pid'),amount:am,method:$('pMet').value},function(){fStay(id);toast('Оплата принята.')},'sErr')}
  if(a==='svc'&&st)return send({t:'svc',sid:id,pid:el.getAttribute('data-pid'),k:el.getAttribute('data-k'),method:$('pMet').value},function(){fStay(id);toast('Услуга записана.')},'sErr');
  if(a==='ext'&&st)return send({t:'ext',sid:id,fromQty:st.qty},function(){fStay(id);toast('Продлено. Не забудьте принять оплату.')},'sErr');
  if(a==='out'&&st){
    if(debtOf(st)>0&&el.getAttribute('data-sure')!=='1'){el.setAttribute('data-sure','1');el.textContent='Выселить с долгом?';$('sErr').textContent='У гостя долг '+money(debtOf(st))+'. Нажмите ещё раз, чтобы выселить.';return}
    return send({t:'out',sid:id},function(){closeSheet();toast('Гость выселен.')},'sErr');
  }
  if(a==='exp-save'){var ea=num('eAmt');if(!ea){$('eErr').textContent='Введите сумму.';return}return send({t:'exp',eid:el.getAttribute('data-eid'),cat:$('eCat').value,amount:ea,from:$('eFrom').value,note:$('eNote').value.trim()},function(){closeSheet();toast('Расход записан.')},'eErr')}
  if(a==='shift-save')return send({t:'shift',hid:el.getAttribute('data-hid'),counted:num('hCnt'),salary:num('hSal'),handed:num('hHan')},function(){if(v3())fReport(el.getAttribute('data-hid'));else{closeSheet();toast('Смена закрыта.')}},'hErr');
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(t){e.preventDefault();if(busy)return;return act(t.getAttribute('data-act'),t)}
  var tb=e.target.closest('#tabs button');if(tb&&S){tab=tb.getAttribute('data-t');return render()}
  if(e.target.id==='whoBtn'&&S)return fWho();
  if(e.target.id==='sheet'&&!busy)closeSheet();
});
document.addEventListener('input',function(e){
  var i=e.target.id;if(i==='cTar'&&$('cUnit'))$('cUnit').value=tariff($('cTar').value).price;if(i==='cPhone')lookup();if((i==='rAmt'||i==='rNote')&&$('xErr'))$('xErr').textContent='';if(i==='oCnt')calcOpen();if(i==='cTar'||i==='cQty'||i==='cIn'||i==='cUnit')calcIn(true);else if(i==='cPaid')calcIn(false);else if(i==='hCnt')calcShift();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='codeIn')login(e.target.value);if(e.key==='Enter'&&e.target.id==='apiIn'){var b=document.querySelector('[data-act="api-save"]');if(b)b.click()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
setInterval(function(){if(!document.hidden)refresh()},60000);

render();
var saved=lsGet(LS_CODE);
if(saved&&apiUrl()){code=saved;send(null,null,'gErr')}
})();
</script>
</body>
</html>
